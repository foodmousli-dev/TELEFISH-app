<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telefish App</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#4f46e5;--bd:#e5e7eb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eef0f6;--mu:#9aa3b5;--ac:#818cf8;--bd:#2c3040}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eef0f6;--mu:#9aa3b5;--ac:#818cf8;--bd:#2c3040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{padding:20px 16px 8px;max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.5rem}
main{max-width:900px;margin:auto;padding:8px 16px 40px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.bar{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:140px;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;gap:10px;align-items:center}
.ic img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.ic{font-size:2rem;width:52px;height:52px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.card h3{margin:0;font-size:1.05rem}
.mu{color:var(--mu);font-size:.85rem}
.desc{font-size:.9rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(440px,92vw);padding:18px}
dialog::backdrop{background:#0008}
label{display:block;margin:8px 0 2px;font-size:.9rem}
dialog input,dialog select,dialog textarea{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#msg{color:var(--mu);font-size:.85rem;margin-top:8px}
</style>
</head>

function render(){
  const q=$("q").value.trim().toLowerCase(),c=$("cat").value;
  const rows=apps.filter(a=>(!c||a.cat===c)&&(!q||(a.name+a.desc).toLowerCase().includes(q)));
  $("empty").hidden=rows.length>0;
  $("list").innerHTML=rows.map(a=>`<div class="card">
    <div class="top"><div class="ic">${/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(a.iconImg||"")?`<img src="${a.iconImg}" alt="">`:a.icon?esc(a.icon):`<img src="${LOGO}" alt="">`}</div>
    <div><h3>${esc(a.name)}</h3><div class="mu">${esc(a.cat)} · v${esc(a.ver)}</div></div></div>
    <div class="desc">${esc(a.desc)}</div>
    <div class="row"><span class="mu">⬇ ${a.downloads||0}</span>
    <button class="btn" data-id="${esc(a.id)}">تحميل</button></div></div>`).join("");
}
$("q").oninput=render;$("cat").onchange=render;

const st=t=>{$("st").textContent=t||""};
let iconData="";
$("f-iconfile").onchange=e=>{
  const f=e.target.files[0];iconData="";$("ic-prev").style.display="none";
  if(!f)return;
  if(!/^image\//.test(f.type)){$("msg").textContent="اختر ملف صورة.";e.target.value="";return}
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const s=Math.min(im.width,im.height),c=document.createElement("canvas");c.width=c.height=128;
    c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);
    iconData=c.toDataURL("image/png");$("ic-prev").src=iconData;$("ic-prev").style.display="block";URL.revokeObjectURL(u);
  };
  im.onerror=()=>{$("msg").textContent="تعذر قراءة الصورة.";URL.revokeObjectURL(u)};
  im.src=u;
};
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const readB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=()=>no(new Error("تعذر قراءة الملف"));r.readAsDataURL(f)});

$("list").onclick=async e=>{
  const id=e.target.dataset?.id;if(!id)return;
  const a=apps.find(x=>x.id===id);if(!a)return;
  try{
    if(a.chunks){
      st("جارٍ تجهيز الملف…");
      const parts=[];
      for(let i=0;i<a.chunks;i++){const s=await db.doc("chunks/"+id+"_"+i).get();parts.push(b2u(s.data().d))}
      const dl=await window.claude.use("downloads");
      if(!dl)throw new Error("التحميل المباشر غير متاح في هذا العرض.");
      const blob=new Blob(parts),fn=a.fname||a.name;
      try{await dl.save({filename:fn,data:blob})}
      catch(err){
        if(err&&/extension/.test(err.code)){await dl.save({filename:fn+".bin",data:blob});st("حُفظ الملف باسم "+fn+".bin — احذف .bin من الاسم بعد التحميل.");return}
        throw err;
      }
    }else if(/^(https?:\/\/|\/_blob\/)/.test(a.link||"")){window.open(a.link,"_blank","noopener")}
    else return;
    st("");
    try{await col.doc(id).update({downloads:(a.downloads||0)+1})}catch(_){}
  }catch(err){st((err&&err.message)||"تعذر التحميل")}
};

$("pub").onclick=()=>{
  if(!col){st("النشر يتطلب فتح المتجر بحساب لديه صلاحية الكتابة.");return}
  $("msg").textContent="";$("dlg").showModal();
};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{
  const name=$("f-name").value.trim();
  if(!name){$("msg").textContent="أدخل اسم التطبيق.";return}
  let link=$("f-url").value.trim(),chunks=0,fname="";
  $("save").disabled=true;
  try{
    const f=$("f-file").files[0];
    const id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    if(f){
      fname=f.name;let ok=false;
      if(assets){try{$("msg").textContent="جارٍ الرفع…";link=(await assets.upload(f)).url;ok=true}catch(_){}}
      if(!ok){
        if(f.size>5*1024*1024)throw new Error("حجم الملف أكبر من 5 ميغابايت. ضع رابط تحميل بدلاً منه.");
        const b=await readB64(f),N=150000;chunks=Math.ceil(b.length/N);
        for(let i=0;i<chunks;i++){
          $("msg").textContent="جارٍ الرفع "+(i+1)+"/"+chunks;
          await db.doc("chunks/"+id+"_"+i).set({d:b.slice(i*N,(i+1)*N)});
        }
        link="";
      }
    }
    if(!chunks&&!/^(https?:\/\/|\/_blob\/)/.test(link))throw new Error("أضف ملفاً أو رابط تحميل صحيحاً.");
    await col.doc(id).set({name,desc:$("f-desc").value.trim(),cat:$("f-cat").value,ver:$("f-ver").value.trim()||"1.0",icon:$("f-icon").value.trim(),iconImg:iconData,link,chunks,fname,downloads:0,t:Date.now()});
    $("dlg").close();["f-name","f-desc","f-url","f-file","f-iconfile","f-icon"].forEach(i=>$(i).value="");iconData="";$("ic-prev").style.display="none";$("msg").textContent="";
  }catch(err){$("msg").textContent=(err&&err.message)||"تعذر النشر."}
  $("save").disabled=false;
};

(async()=>{
  st("جارٍ الاتصال…");
  try{
    const c=window.claude;
    db=c&&await c.use("db");assets=c&&await c.use("assets");
    if(!db){st("تعذر الاتصال بقاعدة البيانات. افتح المتجر من حسابك على claude.ai.");return}
    col=db.collection("apps");
    col.onSnapshot(s=>{st("");apps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.t||0)-(a.t||0));render()},e=>st("خطأ في القراءة: "+(e&&e.message||"")));
  }catch(e){st("خطأ: "+(e&&e.message||""))}
})();
render();
</script>
</body>
</html>
